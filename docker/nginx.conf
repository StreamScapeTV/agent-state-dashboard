worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  server_tokens off;

  client_body_temp_path /tmp/nginx/client_temp;
  proxy_temp_path /tmp/nginx/proxy_temp;
  fastcgi_temp_path /tmp/nginx/fastcgi_temp;
  uwsgi_temp_path /tmp/nginx/uwsgi_temp;
  scgi_temp_path /tmp/nginx/scgi_temp;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Supabase Realtime documents `vsn` and `log_level` as optional WebSocket
  # protocol query parameters. The browser-provided API key is deliberately not
  # forwarded; the runtime secret is substituted into the upstream query.
  map $arg_vsn $realtime_vsn {
    '' '';
    default "&vsn=$arg_vsn";
  }
  map $arg_log_level $realtime_log_level {
    '' '';
    default "&log_level=$arg_log_level";
  }

  server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location ^~ /supabase/rest/v1/ {
      if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
      }

      access_log off;
      proxy_http_version 1.1;
      proxy_ssl_server_name on;
      proxy_set_header Host $proxy_host;
      proxy_set_header Connection "";
      proxy_set_header apikey "${SUPABASE_SECRET_KEY}";
      proxy_set_header Authorization "";
      proxy_hide_header apikey;
      proxy_hide_header Authorization;
      proxy_pass ${SUPABASE_URL}/rest/v1/;

      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
    }

    location = /supabase/realtime/v1/websocket {
      if ($request_method != GET) {
        return 405;
      }

      access_log off;
      set $args "apikey=${SUPABASE_SECRET_KEY}${realtime_vsn}${realtime_log_level}";
      proxy_http_version 1.1;
      proxy_ssl_server_name on;
      proxy_set_header Host $proxy_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header apikey "${SUPABASE_SECRET_KEY}";
      proxy_set_header x-api-key "${SUPABASE_SECRET_KEY}";
      proxy_set_header Authorization "";
      proxy_hide_header apikey;
      proxy_hide_header Authorization;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_pass ${SUPABASE_URL}/realtime/v1/websocket;

      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
      add_header X-Accel-Buffering "no" always;
    }

    location /_next/static/ {
      try_files $uri =404;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
      try_files $uri $uri/ $uri.html /index.html;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }
  }
}
