worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  server_tokens off;

  client_body_temp_path /tmp/nginx/client_temp;
  proxy_temp_path /tmp/nginx/proxy_temp;
  fastcgi_temp_path /tmp/nginx/fastcgi_temp;
  uwsgi_temp_path /tmp/nginx/uwsgi_temp;
  scgi_temp_path /tmp/nginx/scgi_temp;

  proxy_ssl_server_name on;
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  proxy_ssl_verify_depth 5;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Keep Realtime query rewriting limited to documented protocol values. The
  # browser-provided API key is never forwarded; the runtime secret is the only
  # upstream authority.
  map $arg_vsn $realtime_vsn {
    '' '';
    '1.0.0' '&vsn=1.0.0';
    '2.0.0' '&vsn=2.0.0';
    default '';
  }
  map $arg_log_level $realtime_log_level {
    '' '';
    'info' '&log_level=info';
    'warn' '&log_level=warn';
    'error' '&log_level=error';
    default '';
  }

  server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    ssl_certificate /tls/tls.crt;
    ssl_certificate_key /tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # The privileged gateway is deliberately narrower than the Supabase Data
    # API. Only the five current Agent State authority tables are reachable.
    location ~ ^/supabase/rest/v1/(current_projects|current_agents|current_work|current_resources|current_coordination)/?$ {
      if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
      }
      if ($arg_apikey != '') {
        return 400;
      }

      access_log off;
      error_log /dev/null emerg;
      rewrite ^/supabase/rest/v1/(current_projects|current_agents|current_work|current_resources|current_coordination)/?$ /rest/v1/$1 break;
      proxy_http_version 1.1;
      proxy_set_header Host $proxy_host;
      proxy_set_header Connection "";
      proxy_set_header User-Agent "StreamScapeTV-Agent-State-Dashboard-Gateway/1";
      proxy_set_header apikey "${SUPABASE_SECRET_KEY}";
      proxy_set_header Authorization "";
      proxy_set_header X-HTTP-Method-Override "";
      proxy_hide_header apikey;
      proxy_hide_header Authorization;
      proxy_pass ${SUPABASE_URL};

      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
    }

    location = /supabase/rest/v1 {
      return 404;
    }
    location /supabase/rest/v1/ {
      return 404;
    }

    location = /supabase/realtime/v1/websocket {
      if ($request_method != GET) {
        return 405;
      }

      access_log off;
      error_log /dev/null emerg;
      set $args "apikey=${SUPABASE_SECRET_KEY}${realtime_vsn}${realtime_log_level}";
      proxy_http_version 1.1;
      proxy_set_header Host $proxy_host;
      proxy_set_header User-Agent "StreamScapeTV-Agent-State-Dashboard-Gateway/1";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header apikey "${SUPABASE_SECRET_KEY}";
      proxy_set_header x-api-key "${SUPABASE_SECRET_KEY}";
      proxy_set_header Authorization "";
      proxy_hide_header apikey;
      proxy_hide_header Authorization;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_pass ${SUPABASE_URL}/realtime/v1/websocket;

      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
      add_header X-Accel-Buffering "no" always;
    }

    location /_next/static/ {
      try_files $uri =404;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
      try_files $uri $uri/ $uri.html /index.html;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }
  }
}
