name: Publish existing dashboard 0.1.2 native release

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Exact incident recovery request identity
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-state-dashboard-existing-native-0.1.2
  cancel-in-progress: false

jobs:
  release:
    name: Publish exact existing 0.1.2 native image and chart
    if: >-
      github.repository == 'StreamScapeTV/agent-state-dashboard' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.request_id == 'issue-55-native-existing-tag-0.1.2'
    uses: StreamScapeTV/ci-workflows/.github/workflows/reusable-native-image-chart.yml@9e85bd68ad5c26c8b087f7907acb1427f76fcca0
    with:
      release_mode: existing-tag
      release_version: 0.1.2
      release_source_sha: 3187db893f5629d8703897a83245df46b62b6f7d
      image_name: agent-state-dashboard
      chart_name: agent-state-dashboard
      chart_path: charts/agent-state-dashboard
      dockerfile_path: Dockerfile
      build_context: .
    secrets:
      registry_username: ${{ secrets.FORGEJO_REGISTRY_USERNAME }}
      registry_token: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}

  report:
    name: Report immutable native release evidence
    needs: release
    if: always()
    runs-on: [linux, amd64, general, tiny]
    timeout-minutes: 10
    env:
      RELEASE_RESULT: ${{ needs.release.result }}
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
      RELEASE_SOURCE_SHA: ${{ needs.release.outputs.source_sha }}
      IMAGE_REFERENCE: ${{ needs.release.outputs.image_reference }}
      IMAGE_DIGEST: ${{ needs.release.outputs.image_digest }}
      CHART_REFERENCE: ${{ needs.release.outputs.chart_reference }}
      CHART_DIGEST: ${{ needs.release.outputs.chart_digest }}
      CHART_PACKAGE_SHA256: ${{ needs.release.outputs.chart_package_sha256 }}
      ISSUE_TOKEN: ${{ github.token }}
    steps:
      - name: Verify and report bounded publication evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import urllib.request

          expected_version = "0.1.2"
          expected_source = "3187db893f5629d8703897a83245df46b62b6f7d"
          result = os.environ["RELEASE_RESULT"]
          version = os.environ["RELEASE_VERSION"]
          source = os.environ["RELEASE_SOURCE_SHA"]
          image_reference = os.environ["IMAGE_REFERENCE"]
          image_digest = os.environ["IMAGE_DIGEST"]
          chart_reference = os.environ["CHART_REFERENCE"]
          chart_digest = os.environ["CHART_DIGEST"]
          chart_package_sha256 = os.environ["CHART_PACKAGE_SHA256"]

          success = result == "success"
          if success:
              if version != expected_version or source != expected_source:
                  raise SystemExit("native_release_identity_mismatch")
              if image_reference != "git.faruqi.dev/mimranfaruqi/agent-state-dashboard:0.1.2":
                  raise SystemExit("native_release_image_reference_mismatch")
              if not chart_reference.endswith("/agent-state-dashboard:0.1.2"):
                  raise SystemExit("native_release_chart_reference_mismatch")
              digest = re.compile(r"sha256:[0-9a-f]{64}")
              if digest.fullmatch(image_digest) is None:
                  raise SystemExit("native_release_image_digest_invalid")
              if digest.fullmatch(chart_digest) is None:
                  raise SystemExit("native_release_chart_digest_invalid")
              if re.fullmatch(r"[0-9a-f]{64}", chart_package_sha256) is None:
                  raise SystemExit("native_release_chart_package_sha256_invalid")

          marker = "agent-state-dashboard-native-existing-tag-0.1.2"
          body = (
              f"<!-- {marker} -->\n"
              f"Native existing-tag release result: `{result}`.\n\n"
              f"- workflow run: `{os.environ['GITHUB_RUN_ID']}`\n"
              f"- version: `{version}`\n"
              f"- source: `{source}`\n"
              f"- image: `{image_reference}`\n"
              f"- image digest: `{image_digest}`\n"
              f"- chart: `{chart_reference}`\n"
              f"- chart digest: `{chart_digest}`\n"
              f"- chart package sha256: `{chart_package_sha256}`\n"
              f"- Actions artifacts: expected zero by release contract"
          )
          payload = json.dumps({"body": body}, separators=(",", ":")).encode("utf-8")
          request = urllib.request.Request(
              "https://api.github.com/repos/StreamScapeTV/agent-state-dashboard/issues/55/comments",
              data=payload,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['ISSUE_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "StreamScapeTV-agent-state-dashboard-native-existing-tag-report",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in {200, 201}:
                  raise SystemExit("native_release_issue_report_failed")

          if not success:
              raise SystemExit(f"native_release_failed:{result}")
          PY
