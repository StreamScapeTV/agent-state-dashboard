name: Finalize dashboard 0.1.2 release

on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: agent-state-dashboard-finalize-release-0.1.2
  cancel-in-progress: false

jobs:
  finalize_release:
    name: Publish 0.1.2 and verify final cleanup
    if: >-
      github.repository == 'StreamScapeTV/agent-state-dashboard' &&
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == 'StreamScapeTV/agent-state-dashboard' &&
      github.event.pull_request.head.ref == 'orchestrator/issue-55-retire-release-helpers' &&
      github.event.pull_request.user.login == 'mimranfaruqi' &&
      github.event.pull_request.title == '[#55] Retire temporary release helpers after 0.1.2' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: 0.1.2
      RELEASE_SOURCE_SHA: 3187db893f5629d8703897a83245df46b62b6f7d
      ADMISSION_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Report finalizer start to issue 55
        continue-on-error: true
        shell: bash
        env:
          ISSUE_COMMENT_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          body = (
              "<!-- agent-state-dashboard-finalize-release-0.1.2-start -->\n"
              f"Finalizer run `{os.environ['GITHUB_RUN_ID']}` started for cleanup PR "
              f"`#{os.environ['PR_NUMBER']}` with base `{os.environ['PR_BASE_SHA']}` and "
              f"head `{os.environ['PR_HEAD_SHA']}`."
          )
          payload = json.dumps({"body": body}, separators=(",", ":")).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/55/comments",
              data=payload,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['ISSUE_COMMENT_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "StreamScapeTV-agent-state-dashboard-0.1.2-finalizer-start",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in {200, 201}:
                  raise SystemExit("finalizer_start_comment_failed")
          PY

      - id: admit
        name: Admit exact cleanup and release authority
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          release_tag = os.environ["RELEASE_TAG"]
          release_source_sha = os.environ["RELEASE_SOURCE_SHA"]
          pr_number = os.environ["PR_NUMBER"]
          pr_base_sha = os.environ["PR_BASE_SHA"]
          pr_head_sha = os.environ["PR_HEAD_SHA"]
          caller_sha = os.environ["GITHUB_SHA"]
          token = os.environ["ADMISSION_TOKEN"]

          if repository != "StreamScapeTV/agent-state-dashboard" or os.environ["GITHUB_EVENT_NAME"] != "pull_request_target":
              raise SystemExit("finalizer_event_not_trusted")
          if release_tag != "0.1.2":
              raise SystemExit("finalizer_release_tag_mismatch")
          for name, value in (
              ("release_source", release_source_sha),
              ("pr_base", pr_base_sha),
              ("pr_head", pr_head_sha),
              ("caller", caller_sha),
          ):
              if re.fullmatch(r"[0-9a-f]{40}", value) is None:
                  raise SystemExit(f"finalizer_{name}_sha_invalid")
          if caller_sha != pr_base_sha:
              raise SystemExit("finalizer_caller_base_mismatch")
          if not pr_number.isdigit() or int(pr_number) <= 0:
              raise SystemExit("finalizer_pr_number_invalid")
          if not token:
              raise SystemExit("finalizer_admission_token_required")

          api_root = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "StreamScapeTV-agent-state-dashboard-0.1.2-finalizer",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method: str, path: str, *, missing_ok: bool = False):
              req = urllib.request.Request(f"{api_root}{path}", headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read(2_000_001)
              except urllib.error.HTTPError as error:
                  if missing_ok and error.code == 404:
                      return None
                  raise SystemExit(f"finalizer_github_http_{error.code}") from None
              except OSError:
                  raise SystemExit("finalizer_github_request_failed") from None
              if len(raw) > 2_000_000:
                  raise SystemExit("finalizer_github_response_too_large")
              try:
                  return json.loads(raw.decode("utf-8")) if raw else {}
              except (UnicodeDecodeError, json.JSONDecodeError):
                  raise SystemExit("finalizer_github_response_invalid") from None

          main_ref = request("GET", "/git/ref/heads/main")
          if not isinstance(main_ref, dict) or main_ref.get("object", {}).get("sha") != pr_base_sha:
              raise SystemExit("finalizer_main_drifted_from_pr_base")

          pull = request("GET", f"/pulls/{pr_number}")
          if not isinstance(pull, dict):
              raise SystemExit("finalizer_pull_invalid")
          if pull.get("state") != "open" or pull.get("draft") is not False:
              raise SystemExit("finalizer_pull_not_merge_candidate")
          if pull.get("base", {}).get("ref") != "main" or pull.get("base", {}).get("sha") != pr_base_sha:
              raise SystemExit("finalizer_pull_base_mismatch")
          if pull.get("head", {}).get("ref") != "orchestrator/issue-55-retire-release-helpers":
              raise SystemExit("finalizer_pull_head_ref_mismatch")
          if pull.get("head", {}).get("sha") != pr_head_sha:
              raise SystemExit("finalizer_pull_head_sha_mismatch")
          if pull.get("head", {}).get("repo", {}).get("full_name") != repository:
              raise SystemExit("finalizer_pull_head_repository_mismatch")
          if pull.get("user", {}).get("login") != "mimranfaruqi":
              raise SystemExit("finalizer_pull_author_mismatch")
          if pull.get("title") != "[#55] Retire temporary release helpers after 0.1.2":
              raise SystemExit("finalizer_pull_title_mismatch")

          files = request("GET", f"/pulls/{pr_number}/files?per_page=100")
          if not isinstance(files, list):
              raise SystemExit("finalizer_pull_files_invalid")
          expected_files = {
              ".github/workflows/cut-release-0.1.1-arc.yml",
              ".github/workflows/cut-release-0.1.1-pr.yml",
              ".github/workflows/cut-release-0.1.1-tag.yml",
              ".github/workflows/release-existing-tag-0.1.1.yml",
              ".github/workflows/cut-release-0.1.2.yml",
              ".github/workflows/finalize-release-0.1.2.yml",
              "tests/release-tag-cut.test.mjs",
              "tests/release-0.1.2-cut.test.mjs",
              "tests/finalize-release-0.1.2.test.mjs",
          }
          filenames = {row.get("filename") for row in files if isinstance(row, dict)}
          if filenames != expected_files or len(files) != len(expected_files):
              raise SystemExit("finalizer_cleanup_file_set_mismatch")
          if any(row.get("status") != "removed" for row in files if isinstance(row, dict)):
              raise SystemExit("finalizer_cleanup_requires_deletions_only")

          source_commit = request("GET", f"/git/commits/{release_source_sha}")
          if not isinstance(source_commit, dict) or source_commit.get("sha") != release_source_sha:
              raise SystemExit("finalizer_release_source_missing")
          comparison = request("GET", f"/compare/{release_source_sha}...{pr_base_sha}")
          if not isinstance(comparison, dict) or comparison.get("status") not in {"ahead", "identical"}:
              raise SystemExit("finalizer_release_source_not_ancestor")
          if comparison.get("merge_base_commit", {}).get("sha") != release_source_sha:
              raise SystemExit("finalizer_release_source_merge_base_mismatch")

          def decoded_contents(path: str) -> str:
              encoded_path = urllib.parse.quote(path, safe="/")
              payload = request("GET", f"/contents/{encoded_path}?ref={release_source_sha}")
              if not isinstance(payload, dict) or payload.get("encoding") != "base64":
                  raise SystemExit("finalizer_release_contents_invalid")
              content = payload.get("content")
              if not isinstance(content, str):
                  raise SystemExit("finalizer_release_contents_missing")
              try:
                  return base64.b64decode(content).decode("utf-8")
              except (ValueError, UnicodeDecodeError):
                  raise SystemExit("finalizer_release_contents_decode_failed") from None

          package = json.loads(decoded_contents("package.json"))
          if not isinstance(package, dict) or package.get("version") != release_tag:
              raise SystemExit("finalizer_package_version_mismatch")
          chart = decoded_contents("charts/agent-state-dashboard/Chart.yaml")
          if re.search(r"^version:\s*0\.1\.2\s*$", chart, re.MULTILINE) is None:
              raise SystemExit("finalizer_chart_version_mismatch")
          if re.search(r"^appVersion:\s*[\"']?0\.1\.2[\"']?\s*$", chart, re.MULTILINE) is None:
              raise SystemExit("finalizer_chart_app_version_mismatch")

          def successful_main_validation(sha: str, *, attempts: int = 90) -> int:
              last_completed = None
              for attempt in range(attempts):
                  query = urllib.parse.urlencode(
                      {"event": "push", "status": "completed", "head_sha": sha, "per_page": "20"}
                  )
                  payload = request("GET", f"/actions/workflows/validation.yml/runs?{query}")
                  runs = payload.get("workflow_runs", []) if isinstance(payload, dict) else []
                  completed = [
                      run
                      for run in runs
                      if isinstance(run, dict)
                      and run.get("event") == "push"
                      and run.get("head_sha") == sha
                      and run.get("head_branch") == "main"
                      and run.get("name") == "Node validation"
                      and run.get("status") == "completed"
                      and isinstance(run.get("id"), int)
                  ]
                  if completed:
                      run = max(completed, key=lambda item: item["id"])
                      last_completed = run
                      if run.get("conclusion") == "success":
                          run_id = run["id"]
                          artifacts = request("GET", f"/actions/runs/{run_id}/artifacts?per_page=100")
                          if not isinstance(artifacts, dict) or artifacts.get("total_count") != 0:
                              raise SystemExit("finalizer_validation_artifacts_present")
                          return run_id
                  if attempt < attempts - 1:
                      time.sleep(2)
              if last_completed is not None:
                  raise SystemExit(
                      f"finalizer_main_validation_not_green:{last_completed.get('id')}:{last_completed.get('conclusion')}"
                  )
              raise SystemExit("finalizer_main_validation_missing")

          source_validation_run = successful_main_validation(release_source_sha)
          base_validation_run = successful_main_validation(pr_base_sha)

          encoded_tag = urllib.parse.quote(release_tag, safe="")
          existing = request("GET", f"/git/ref/tags/{encoded_tag}", missing_ok=True)
          tag_preexisting = False
          if existing is not None:
              if not isinstance(existing, dict):
                  raise SystemExit("finalizer_existing_tag_invalid")
              ref_object = existing.get("object", {})
              if ref_object.get("type") != "commit" or ref_object.get("sha") != release_source_sha:
                  raise SystemExit("finalizer_existing_tag_conflict")
              tag_preexisting = True

          print(json.dumps({
              "base_validation_run": base_validation_run,
              "cleanup_pr": int(pr_number),
              "release_source_sha": release_source_sha,
              "source_validation_run": source_validation_run,
              "tag": release_tag,
              "tag_preexisting": tag_preexisting,
          }, separators=(",", ":"), sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"source_validation_run={source_validation_run}\n")
              output.write(f"base_validation_run={base_validation_run}\n")
              output.write(f"tag_preexisting={'true' if tag_preexisting else 'false'}\n")
          PY

      - id: tag
        name: Create and read back exact lightweight 0.1.2 tag
        shell: bash
        env:
          ORGANIZATION_MAINTENANCE_TOKEN: ${{ secrets.ORGANIZATION_MAINTENANCE_TOKEN }}
          TAG_PREEXISTING: ${{ steps.admit.outputs.tag_preexisting }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          release_tag = os.environ["RELEASE_TAG"]
          release_source_sha = os.environ["RELEASE_SOURCE_SHA"]
          token = os.environ["ORGANIZATION_MAINTENANCE_TOKEN"]
          preexisting = os.environ["TAG_PREEXISTING"] == "true"

          if not token or any(character in token for character in "\x00\r\n"):
              raise SystemExit("organization_maintenance_token_required")
          if release_tag != "0.1.2" or re.fullmatch(r"[0-9a-f]{40}", release_source_sha) is None:
              raise SystemExit("finalizer_tag_identity_invalid")

          api_root = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "StreamScapeTV-agent-state-dashboard-0.1.2-finalizer-tag",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method: str, path: str, payload: dict[str, str] | None = None, *, missing_ok: bool = False):
              body = None
              request_headers = dict(headers)
              if payload is not None:
                  body = json.dumps(payload, separators=(",", ":")).encode("utf-8")
                  request_headers["Content-Type"] = "application/json"
              req = urllib.request.Request(f"{api_root}{path}", data=body, headers=request_headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read(1_000_001)
              except urllib.error.HTTPError as error:
                  if missing_ok and error.code == 404:
                      return None
                  raise SystemExit(f"finalizer_tag_github_http_{error.code}") from None
              except OSError:
                  raise SystemExit("finalizer_tag_github_request_failed") from None
              if len(raw) > 1_000_000:
                  raise SystemExit("finalizer_tag_github_response_too_large")
              try:
                  return json.loads(raw.decode("utf-8")) if raw else {}
              except (UnicodeDecodeError, json.JSONDecodeError):
                  raise SystemExit("finalizer_tag_github_response_invalid") from None

          encoded_tag = urllib.parse.quote(release_tag, safe="")
          tag_path = f"/git/ref/tags/{encoded_tag}"
          action = "verified-existing"
          if not preexisting:
              if request("GET", tag_path, missing_ok=True) is not None:
                  raise SystemExit("finalizer_tag_raced_before_create")
              request("POST", "/git/refs", {"ref": f"refs/tags/{release_tag}", "sha": release_source_sha})
              action = "created"

          readback = request("GET", tag_path)
          if not isinstance(readback, dict):
              raise SystemExit("finalizer_tag_readback_invalid")
          ref_object = readback.get("object", {})
          if ref_object.get("type") != "commit" or ref_object.get("sha") != release_source_sha:
              raise SystemExit("finalizer_tag_readback_mismatch")
          print(json.dumps({"action": action, "source_sha": release_source_sha, "tag": release_tag}, separators=(",", ":"), sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"action={action}\n")
          PY

      - id: release
        name: Wait for normal tag-push release to succeed
        shell: bash
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          release_source_sha = os.environ["RELEASE_SOURCE_SHA"]
          token = os.environ["ACTIONS_READ_TOKEN"]
          if not token:
              raise SystemExit("finalizer_actions_read_token_required")
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "StreamScapeTV-agent-state-dashboard-0.1.2-finalizer-release",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url: str):
              request = urllib.request.Request(url, headers=headers, method="GET")
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          query = urllib.parse.urlencode({"event": "push", "head_sha": release_source_sha, "per_page": "20"})
          list_url = f"https://api.github.com/repos/{repository}/actions/workflows/release.yml/runs?{query}"
          observed = None
          for attempt in range(180):
              payload = get_json(list_url)
              runs = payload.get("workflow_runs", []) if isinstance(payload, dict) else []
              matches = [
                  run
                  for run in runs
                  if isinstance(run, dict)
                  and run.get("event") == "push"
                  and run.get("head_sha") == release_source_sha
                  and run.get("name") == "Publish tagged dashboard image and chart"
                  and isinstance(run.get("id"), int)
              ]
              if matches:
                  observed = max(matches, key=lambda item: item["id"])
                  if observed.get("status") == "completed":
                      break
              if attempt < 179:
                  time.sleep(2)
          if observed is None:
              raise SystemExit("finalizer_release_run_not_observed")
          if observed.get("status") != "completed":
              raise SystemExit(f"finalizer_release_run_not_completed:{observed.get('id')}")
          if observed.get("conclusion") != "success":
              raise SystemExit(f"finalizer_release_failed:{observed.get('id')}:{observed.get('conclusion')}")
          run_id = observed["id"]
          artifacts = get_json(f"https://api.github.com/repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100")
          if not isinstance(artifacts, dict) or artifacts.get("total_count") != 0:
              raise SystemExit("finalizer_release_artifacts_present")
          print(json.dumps({"conclusion": "success", "release_run_id": run_id}, separators=(",", ":"), sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_id={run_id}\n")
          PY

      - name: Report successful publication and cleanup readiness
        if: ${{ steps.release.outcome == 'success' }}
        shell: bash
        env:
          ISSUE_COMMENT_TOKEN: ${{ github.token }}
          SOURCE_VALIDATION_RUN: ${{ steps.admit.outputs.source_validation_run }}
          BASE_VALIDATION_RUN: ${{ steps.admit.outputs.base_validation_run }}
          TAG_ACTION: ${{ steps.tag.outputs.action }}
          RELEASE_RUN_ID: ${{ steps.release.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          body = (
              "<!-- agent-state-dashboard-finalize-release-0.1.2-ready -->\n"
              f"Finalizer run `{os.environ['GITHUB_RUN_ID']}` proved release source validation "
              f"`{os.environ['SOURCE_VALIDATION_RUN']}` and current-main validation "
              f"`{os.environ['BASE_VALIDATION_RUN']}`, tag action `{os.environ['TAG_ACTION']}`, "
              f"and successful normal tag-push release run `{os.environ['RELEASE_RUN_ID']}`. "
              f"Cleanup PR `#{os.environ['PR_NUMBER']}` is release-ready to merge."
          )
          payload = json.dumps({"body": body}, separators=(",", ":")).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/55/comments",
              data=payload,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['ISSUE_COMMENT_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "StreamScapeTV-agent-state-dashboard-0.1.2-finalizer-ready",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in {200, 201}:
                  raise SystemExit("finalizer_ready_comment_failed")
          PY

      - id: cleanup
        name: Wait for cleanup merge and verify final main validation
        if: ${{ steps.release.outcome == 'success' }}
        shell: bash
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          token = os.environ["ACTIONS_READ_TOKEN"]
          if not token:
              raise SystemExit("finalizer_cleanup_actions_token_required")
          api_root = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "StreamScapeTV-agent-state-dashboard-0.1.2-finalizer-cleanup",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(path: str):
              request = urllib.request.Request(f"{api_root}{path}", headers=headers, method="GET")
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          merge_sha = None
          for attempt in range(600):
              pull = get(f"/pulls/{pr_number}")
              if isinstance(pull, dict) and pull.get("merged") is True:
                  merge_sha = pull.get("merge_commit_sha")
                  break
              if attempt < 599:
                  time.sleep(2)
          if not isinstance(merge_sha, str) or re.fullmatch(r"[0-9a-f]{40}", merge_sha) is None:
              raise SystemExit("finalizer_cleanup_merge_not_observed")

          main_ref = get("/git/ref/heads/main")
          if not isinstance(main_ref, dict) or main_ref.get("object", {}).get("sha") != merge_sha:
              raise SystemExit("finalizer_cleanup_merge_not_current_main")

          validation_run = None
          last_completed = None
          for attempt in range(180):
              query = urllib.parse.urlencode(
                  {"event": "push", "status": "completed", "head_sha": merge_sha, "per_page": "20"}
              )
              payload = get(f"/actions/workflows/validation.yml/runs?{query}")
              runs = payload.get("workflow_runs", []) if isinstance(payload, dict) else []
              completed = [
                  run
                  for run in runs
                  if isinstance(run, dict)
                  and run.get("event") == "push"
                  and run.get("head_sha") == merge_sha
                  and run.get("head_branch") == "main"
                  and run.get("name") == "Node validation"
                  and run.get("status") == "completed"
                  and isinstance(run.get("id"), int)
              ]
              if completed:
                  last_completed = max(completed, key=lambda item: item["id"])
                  if last_completed.get("conclusion") == "success":
                      validation_run = last_completed["id"]
                      break
              if attempt < 179:
                  time.sleep(2)
          if validation_run is None:
              if last_completed is not None:
                  raise SystemExit(
                      f"finalizer_cleanup_validation_not_green:{last_completed.get('id')}:{last_completed.get('conclusion')}"
                  )
              raise SystemExit("finalizer_cleanup_validation_missing")
          artifacts = get(f"/actions/runs/{validation_run}/artifacts?per_page=100")
          if not isinstance(artifacts, dict) or artifacts.get("total_count") != 0:
              raise SystemExit("finalizer_cleanup_validation_artifacts_present")

          print(json.dumps({"cleanup_merge_sha": merge_sha, "cleanup_validation_run": validation_run}, separators=(",", ":"), sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"merge_sha={merge_sha}\n")
              output.write(f"validation_run={validation_run}\n")
          PY

      - name: Report final cleanup evidence
        if: ${{ steps.cleanup.outcome == 'success' }}
        shell: bash
        env:
          ISSUE_COMMENT_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ steps.release.outputs.run_id }}
          CLEANUP_MERGE_SHA: ${{ steps.cleanup.outputs.merge_sha }}
          CLEANUP_VALIDATION_RUN: ${{ steps.cleanup.outputs.validation_run }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          body = (
              "<!-- agent-state-dashboard-finalize-release-0.1.2-complete -->\n"
              f"Finalizer run `{os.environ['GITHUB_RUN_ID']}` completed: release run "
              f"`{os.environ['RELEASE_RUN_ID']}` is green with zero Actions artifacts; cleanup "
              f"merged at `{os.environ['CLEANUP_MERGE_SHA']}` and protected-main validation "
              f"`{os.environ['CLEANUP_VALIDATION_RUN']}` is green with zero Actions artifacts."
          )
          payload = json.dumps({"body": body}, separators=(",", ":")).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/55/comments",
              data=payload,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['ISSUE_COMMENT_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "StreamScapeTV-agent-state-dashboard-0.1.2-finalizer-complete",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in {200, 201}:
                  raise SystemExit("finalizer_complete_comment_failed")
          PY

      - name: Report bounded finalizer failure
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          ISSUE_COMMENT_TOKEN: ${{ github.token }}
          ADMISSION_OUTCOME: ${{ steps.admit.outcome }}
          TAG_OUTCOME: ${{ steps.tag.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          RELEASE_RUN_ID: ${{ steps.release.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          body = (
              "<!-- agent-state-dashboard-finalize-release-0.1.2-failure -->\n"
              f"Finalizer run `{os.environ['GITHUB_RUN_ID']}` failed: "
              f"admission=`{os.environ.get('ADMISSION_OUTCOME', '')}`, "
              f"tag=`{os.environ.get('TAG_OUTCOME', '')}`, "
              f"release=`{os.environ.get('RELEASE_OUTCOME', '')}`, "
              f"cleanup=`{os.environ.get('CLEANUP_OUTCOME', '')}`, "
              f"release_run_id=`{os.environ.get('RELEASE_RUN_ID', '')}`."
          )
          payload = json.dumps({"body": body}, separators=(",", ":")).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/55/comments",
              data=payload,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['ISSUE_COMMENT_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "StreamScapeTV-agent-state-dashboard-0.1.2-finalizer-failure",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in {200, 201}:
                  raise SystemExit("finalizer_failure_comment_failed")
          PY
