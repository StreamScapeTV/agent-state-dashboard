name: Finalize dashboard 0.1.2 release

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: agent-state-dashboard-finalize-release-0.1.2-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  finalize_release:
    name: Publish 0.1.2 and verify both cleanup phases
    if: >-
      github.repository == 'StreamScapeTV/agent-state-dashboard' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == 'StreamScapeTV/agent-state-dashboard' &&
      github.event.pull_request.head.ref == 'orchestrator/issue-55-retire-release-helpers' &&
      github.event.pull_request.user.login == 'mimranfaruqi' &&
      github.event.pull_request.title == '[#55] Retire temporary release helpers after 0.1.2' &&
      github.event.pull_request.draft == false
    runs-on: [linux, amd64, general, tiny]
    timeout-minutes: 90
    env:
      PHASE1_PR_NUMBER: ${{ github.event.pull_request.number }}
      PHASE1_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PHASE1_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact phase-1 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false

      - name: Report finalizer start
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/finalize_release_0_1_2.py start

      - id: admit
        name: Admit exact phase-1 cleanup and release authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/finalize_release_0_1_2.py admit

      - id: tag
        name: Create and read back immutable 0.1.2 tag
        env:
          MAINTENANCE_TOKEN: ${{ secrets.ORGANIZATION_MAINTENANCE_TOKEN }}
          TAG_PREEXISTING: ${{ steps.admit.outputs.tag_preexisting }}
        run: python3 .github/scripts/finalize_release_0_1_2.py tag

      - id: orchestrate
        name: Consume normal release and verify both cleanup phases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_ACTION: ${{ steps.tag.outputs.tag_action }}
          SOURCE_VALIDATION_RUN: ${{ steps.admit.outputs.source_validation_run }}
          BASE_VALIDATION_RUN: ${{ steps.admit.outputs.base_validation_run }}
        run: python3 .github/scripts/finalize_release_0_1_2.py orchestrate

      - name: Report bounded finalizer failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_OUTCOME: ${{ steps.admit.outcome }}
          TAG_OUTCOME: ${{ steps.tag.outcome }}
          ORCHESTRATE_OUTCOME: ${{ steps.orchestrate.outcome }}
        run: python3 .github/scripts/finalize_release_0_1_2.py failure
