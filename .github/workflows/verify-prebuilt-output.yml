name: Verify final prebuilt Pages output

on:
  push:
    branches: [issue/1-pages-static-output]

permissions:
  contents: read

concurrency:
  group: dashboard-final-prebuilt-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [linux, amd64, mobile]
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate source boundary
        run: |
          npm test
          npm run typecheck

      - name: Rebuild complete Pages output
        run: npm run pages:build

      - name: Verify reproducible tracked artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f out/index.html
          test -f out/_worker.js
          test -f out/_routes.json
          test -f out/_headers
          grep -q 'ASSETS' out/_worker.js
          grep -q 'get_project_state' out/_worker.js
          grep -q 'get_agent_state' out/_worker.js
          if grep -R -n -E 'AGENT_STATE_SUPABASE_SECRET_KEY|sb_secret_|service_role' out --exclude='_worker.js'; then
            echo "Browser assets contain a server-only secret marker" >&2
            exit 1
          fi
          git diff --exit-code -- tsconfig.json package-lock.json out

      - name: Clean disposable validation state
        if: always()
        run: rm -rf node_modules .next .wrangler package-lock.json.tmp
