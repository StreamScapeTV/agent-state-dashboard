name: Dispatch existing dashboard 0.1.2 native release

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: agent-state-dashboard-dispatch-existing-native-0.1.2
  cancel-in-progress: false

jobs:
  dispatch:
    name: Admit owner command and dispatch default-branch publisher
    if: >-
      github.repository == 'StreamScapeTV/agent-state-dashboard' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 55 &&
      !github.event.issue.pull_request &&
      github.actor == 'mimranfaruqi' &&
      github.event.comment.user.login == 'mimranfaruqi' &&
      github.event.comment.body == '/publish-existing-0.1.2-native'
    runs-on: [linux, amd64, general, tiny]
    timeout-minutes: 10
    env:
      DISPATCH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN_SHA: ${{ github.sha }}
    steps:
      - name: Verify immutable tag and dispatch bounded recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = "StreamScapeTV/agent-state-dashboard"
          expected_source = "3187db893f5629d8703897a83245df46b62b6f7d"
          expected_main = os.environ["EXPECTED_MAIN_SHA"]
          token = os.environ["DISPATCH_TOKEN"]
          if not token:
              raise SystemExit("native_dispatch_token_required")

          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "StreamScapeTV-agent-state-dashboard-native-existing-tag-dispatch",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method: str, path: str, payload: dict[str, object] | None = None):
              body = None
              request_headers = dict(headers)
              if payload is not None:
                  body = json.dumps(payload, separators=(",", ":")).encode("utf-8")
                  request_headers["Content-Type"] = "application/json"
              req = urllib.request.Request(f"{api}{path}", data=body, headers=request_headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read(1_000_001)
                      status = response.status
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"native_dispatch_github_http_{error.code}") from None
              except OSError:
                  raise SystemExit("native_dispatch_github_request_failed") from None
              if len(raw) > 1_000_000:
                  raise SystemExit("native_dispatch_github_response_too_large")
              if not raw:
                  return status, {}
              try:
                  return status, json.loads(raw.decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError):
                  raise SystemExit("native_dispatch_github_response_invalid") from None

          _, main_ref = request("GET", "/git/ref/heads/main")
          if not isinstance(main_ref, dict) or main_ref.get("object", {}).get("sha") != expected_main:
              raise SystemExit("native_dispatch_main_drifted")

          _, tag_ref = request("GET", "/git/ref/tags/0.1.2")
          if not isinstance(tag_ref, dict):
              raise SystemExit("native_dispatch_tag_missing")
          tag_object = tag_ref.get("object", {})
          if tag_object.get("type") != "commit" or tag_object.get("sha") != expected_source:
              raise SystemExit("native_dispatch_tag_target_mismatch")

          workflow_path = urllib.parse.quote(
              ".github/workflows/release-existing-tag-0.1.2.yml",
              safe="/",
          )
          _, workflow = request("GET", f"/contents/{workflow_path}?ref=main")
          if not isinstance(workflow, dict) or workflow.get("type") != "file":
              raise SystemExit("native_dispatch_publisher_not_on_main")

          status, _ = request(
              "POST",
              "/actions/workflows/release-existing-tag-0.1.2.yml/dispatches",
              {
                  "ref": "main",
                  "inputs": {"request_id": "issue-55-native-existing-tag-0.1.2"},
              },
          )
          if status != 204:
              raise SystemExit(f"native_dispatch_unexpected_status:{status}")

          comment = (
              "<!-- agent-state-dashboard-native-existing-tag-0.1.2-dispatch -->\n"
              f"Accepted owner command and dispatched the bounded native existing-tag publisher from main `{expected_main}` "
              f"for immutable tag `0.1.2` -> `{expected_source}`."
          )
          status, _ = request("POST", "/issues/55/comments", {"body": comment})
          if status not in {200, 201}:
              raise SystemExit("native_dispatch_issue_report_failed")
          PY
