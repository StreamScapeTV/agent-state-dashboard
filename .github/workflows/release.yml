name: Publish tagged dashboard image and chart

run-name: Publish tagged dashboard release ${{ github.ref_name }}

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

# Release runs are keyed to the immutable release tag. Do not cancel an in-flight
# publication for the same version; the central publisher remains idempotent.
concurrency:
  group: agent-state-dashboard-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    uses: StreamScapeTV/ci-workflows/.github/workflows/reusable-native-image-chart.yml@1eb1f28566c16ae296c448ff856d5b258283c7e6
    with:
      image_name: agent-state-dashboard
      chart_name: agent-state-dashboard
      chart_path: charts/agent-state-dashboard
      dockerfile_path: Dockerfile
      build_context: .
    secrets:
      registry_username: ${{ secrets.FORGEJO_REGISTRY_USERNAME }}
      registry_token: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
