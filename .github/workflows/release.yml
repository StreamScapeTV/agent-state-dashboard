name: Publish tagged dashboard image and chart

run-name: Publish tagged dashboard release ${{ github.ref_name }}

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read
  packages: write

# Release runs are keyed to the immutable product tag. Do not cancel an in-flight
# publication for the same version; Central publishes that exact tag once.
concurrency:
  group: agent-state-dashboard-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    uses: StreamScapeTV/ci-workflows/.github/workflows/reusable-public-native-image-chart.yml@main
    with:
      image_name: agent-state-dashboard
      chart_name: agent-state-dashboard
      chart_path: charts/agent-state-dashboard
      dockerfile_path: Dockerfile
      build_context: .
