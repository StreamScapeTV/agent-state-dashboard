name: Node validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact lowercase commit SHA to validate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: node-validation-${{ github.event.pull_request.head.sha || inputs.target_sha || github.sha }}
  cancel-in-progress: true

jobs:
  source:
    name: Admit exact dashboard source
    uses: StreamScapeTV/ci-workflows/.github/workflows/reusable-resolve-source.yml@e8c7e9e3a756b5f35f0e4257dc5915e633926545
    with:
      source_mode: ${{ github.event_name == 'pull_request' && 'pr-head' || github.event_name == 'push' && 'push' || 'manual' }}
      requested_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || '' }}
      expected_branch: main

  validate:
    name: CI / Node validation
    needs: source
    uses: StreamScapeTV/ci-workflows/.github/workflows/reusable-node.yml@e8c7e9e3a756b5f35f0e4257dc5915e633926545
    with:
      admitted_sha: ${{ needs.source.outputs.source_sha }}
      validation_profile: frontend-contract-static
      version_file: .nvmrc
      working_directory: .
      install_profile: npm-ci
      command_profile: contract-test-build
      static_output_directory: out
      public_environment: "{}"
