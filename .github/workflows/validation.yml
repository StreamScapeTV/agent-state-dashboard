name: Node validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/**"
      - ".dockerignore"
      - ".gitignore"
      - ".nvmrc"
      - "Dockerfile"
      - "app/**"
      - "charts/agent-state-dashboard/**"
      - "components/**"
      - "docker/**"
      - "lib/**"
      - "next-env.d.ts"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - "server/**"
      - "tests/**"
      - "tsconfig.json"
      - "types/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".dockerignore"
      - ".gitignore"
      - ".nvmrc"
      - "Dockerfile"
      - "app/**"
      - "charts/agent-state-dashboard/**"
      - "components/**"
      - "docker/**"
      - "lib/**"
      - "next-env.d.ts"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - "server/**"
      - "tests/**"
      - "tsconfig.json"
      - "types/**"
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact lowercase commit SHA to validate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

# Ordinary branch checkpoints may use GitHub-native [skip ci] or [ci skip].
# Final PR heads and protected-main merges must be non-skipped so required
# exact-head and post-merge validation can run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Admit exact dashboard source
    uses: StreamScapeTV/ci-workflows/.github/workflows/reusable-resolve-source.yml@main
    with:
      execution_backend: github-hosted
      source_mode: ${{ github.event_name == 'pull_request' && 'pr-head' || github.event_name == 'push' && 'push' || 'manual' }}
      requested_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || '' }}
      expected_branch: main

  validate:
    name: CI / Node validation
    needs: source
    uses: StreamScapeTV/ci-workflows/.github/workflows/reusable-node.yml@main
    with:
      execution_backend: github-hosted
      admitted_sha: ${{ needs.source.outputs.source_sha }}
      validation_profile: frontend-contract-static
      version_file: .nvmrc
      working_directory: .
      install_profile: npm-ci
      command_profile: contract-test-build
      static_output_directory: out
      public_environment: "{}"
