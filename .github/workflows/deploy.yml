name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: agent-state-dashboard-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy / Cloudflare Workers
    # Production repeats the measured OpenNext build on protected exact source;
    # use the same 4 GiB Node-capable runner class as CI.
    runs-on: [linux, amd64, mobile]
    timeout-minutes: 35
    environment: production
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install exact direct dependencies
        run: npm install --no-audit --no-fund

      - name: Validate read-only boundary
        run: npm test

      - name: Generate Cloudflare binding types
        run: npm run cf-typegen

      - name: Type-check
        run: npm run typecheck

      - name: Build OpenNext Worker
        run: npm run cf:build

      - name: Deploy Worker and set server-only secrets
        id: cloudflare
        uses: cloudflare/wrangler-action@a61fbea3226347cc885c6d1b26b3f47b48e6c0f8 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.114.0"
          packageManager: npm
          command: deploy
          secrets: |
            AGENT_STATE_SUPABASE_URL
            AGENT_STATE_SUPABASE_SECRET_KEY
            TEAM_DOMAIN
            POLICY_AUD
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
          TEAM_DOMAIN: ${{ secrets.TEAM_DOMAIN }}
          POLICY_AUD: ${{ secrets.POLICY_AUD }}

      - name: Clean disposable deployment state
        if: always()
        run: rm -rf node_modules .next .open-next .wrangler cloudflare-env.d.ts package-lock.json

      - name: Publish observable deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_JOB_STATUS: ${{ job.status }}
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: |
          node <<'NODE'
          const state = process.env.DEPLOY_JOB_STATUS === "success" ? "success" : "failure";
          const targetUrl = (process.env.DEPLOYMENT_URL || "").trim();
          const payload = {
            state,
            context: "deploy/cloudflare",
            description: state === "success" ? "Cloudflare Worker deployment succeeded" : "Cloudflare Worker deployment failed",
          };
          if (/^https:\/\//.test(targetUrl)) payload.target_url = targetUrl;

          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`;
          const response = await fetch(url, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "agent-state-dashboard-deploy",
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });
          if (!response.ok) {
            throw new Error(`GitHub deployment status update failed with HTTP ${response.status}`);
          }
          NODE
