name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dashboard-ci-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: CI / Static Pages validation
    runs-on: [linux, amd64, mobile]
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Admit exact source
        shell: bash
        env:
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              test "${PR_HEAD_REPOSITORY}" = "${GITHUB_REPOSITORY}"
              test "${SOURCE_SHA}" = "${PR_HEAD_SHA}"
              ;;
            push)
              test "${SOURCE_SHA}" = "${GITHUB_SHA}"
              ;;
            *)
              echo "Unsupported CI event: ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install exact direct dependencies
        run: npm install --no-audit --no-fund

      - name: Prove read-only boundary
        run: npm test

      - name: Type-check static frontend
        run: npm run typecheck

      - name: Preserve committed static output
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f out/index.html
          test -f out/_routes.json
          test -f out/_headers
          cp -a out "${RUNNER_TEMP}/committed-out"

      - name: Rebuild static export
        run: npm run build

      - name: Prove committed output is reproducible
        shell: bash
        run: diff -qr "${RUNNER_TEMP}/committed-out" out

      - name: Prove secrets are absent from static assets
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -R -n -E 'AGENT_STATE_SUPABASE_SECRET_KEY|sb_secret_|service_role' out; then
            echo "Static output contains a forbidden secret marker" >&2
            exit 1
          fi

      - name: Bundle Pages Functions
        run: npm run pages:functions

      - name: Verify Pages routing contract
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q '"/api/\*"' out/_routes.json
          grep -q 'X-Frame-Options: DENY' out/_headers

      - name: Clean disposable validation state
        if: always()
        run: rm -rf node_modules .next .pages-functions-dist .wrangler package-lock.json "${RUNNER_TEMP}/committed-out"
