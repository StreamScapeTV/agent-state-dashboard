name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: CI / Dashboard validation
    runs-on: [linux, amd64, general]
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install exact direct dependencies
        run: npm install --no-audit --no-fund

      - name: Prove read-only boundary
        run: npm test

      - name: Generate Cloudflare binding types
        run: npm run cf-typegen

      - name: Type-check
        run: npm run typecheck

      - name: Build Next.js Worker
        run: npm run cf:build

      - name: Clean disposable validation state
        if: always()
        run: rm -rf node_modules .next .open-next .wrangler cloudflare-env.d.ts package-lock.json
