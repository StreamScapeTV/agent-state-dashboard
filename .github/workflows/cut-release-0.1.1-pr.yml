name: Dispatch immutable dashboard 0.1.1 tag cut

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: agent-state-dashboard-dispatch-release-0.1.1
  cancel-in-progress: false

jobs:
  dispatch_tag_cut:
    name: Admit cleanup PR and dispatch default-branch tag helper
    if: >-
      github.repository == 'StreamScapeTV/agent-state-dashboard' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.number == 49 &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == 'StreamScapeTV/agent-state-dashboard' &&
      github.event.pull_request.head.ref == 'orchestrator/issue-42-remove-tag-helper' &&
      github.event.pull_request.user.login == 'mimranfaruqi' &&
      github.event.pull_request.title == '[#42] Remove temporary 0.1.1 tag helper' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DISPATCH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Verify exact cleanup diff and dispatch trusted default-branch helper
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import urllib.error
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          event_name = os.environ["GITHUB_EVENT_NAME"]
          pr_number = os.environ["PR_NUMBER"]
          pr_base_sha = os.environ["PR_BASE_SHA"]
          pr_head_sha = os.environ["PR_HEAD_SHA"]
          token = os.environ["DISPATCH_TOKEN"]

          if event_name != "pull_request" or repository != "StreamScapeTV/agent-state-dashboard":
              raise SystemExit("tag_dispatch_event_not_trusted")
          if pr_number != "49":
              raise SystemExit("tag_dispatch_pr_number_mismatch")
          for name, value in (("base", pr_base_sha), ("head", pr_head_sha)):
              if re.fullmatch(r"[0-9a-f]{40}", value) is None:
                  raise SystemExit(f"tag_dispatch_{name}_sha_invalid")
          if not token:
              raise SystemExit("tag_dispatch_token_required")

          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "StreamScapeTV-agent-state-dashboard-release-dispatcher",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(path: str):
              request = urllib.request.Request(f"{api}{path}", headers=headers, method="GET")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read(1_000_001)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"tag_dispatch_github_http_{error.code}") from None
              except OSError:
                  raise SystemExit("tag_dispatch_github_request_failed") from None
              if len(raw) > 1_000_000:
                  raise SystemExit("tag_dispatch_response_too_large")
              try:
                  return json.loads(raw.decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError):
                  raise SystemExit("tag_dispatch_response_invalid") from None

          main_ref = get("/git/ref/heads/main")
          if not isinstance(main_ref, dict) or main_ref.get("object", {}).get("sha") != pr_base_sha:
              raise SystemExit("tag_dispatch_main_drifted")

          pull = get(f"/pulls/{pr_number}")
          if not isinstance(pull, dict):
              raise SystemExit("tag_dispatch_pull_invalid")
          if pull.get("base", {}).get("ref") != "main" or pull.get("base", {}).get("sha") != pr_base_sha:
              raise SystemExit("tag_dispatch_base_identity_mismatch")
          if pull.get("head", {}).get("ref") != "orchestrator/issue-42-remove-tag-helper" or pull.get("head", {}).get("sha") != pr_head_sha:
              raise SystemExit("tag_dispatch_head_identity_mismatch")
          if pull.get("head", {}).get("repo", {}).get("full_name") != repository:
              raise SystemExit("tag_dispatch_head_repository_mismatch")
          if pull.get("user", {}).get("login") != "mimranfaruqi":
              raise SystemExit("tag_dispatch_author_mismatch")
          if pull.get("title") != "[#42] Remove temporary 0.1.1 tag helper" or pull.get("draft") is not False:
              raise SystemExit("tag_dispatch_metadata_mismatch")

          files = get(f"/pulls/{pr_number}/files?per_page=100")
          if not isinstance(files, list):
              raise SystemExit("tag_dispatch_files_invalid")
          expected_files = {
              ".github/workflows/cut-release-0.1.1-tag.yml",
              "tests/release-tag-cut.test.mjs",
          }
          filenames = {row.get("filename") for row in files if isinstance(row, dict)}
          if filenames != expected_files or len(files) != 2:
              raise SystemExit("tag_dispatch_file_set_mismatch")
          if any(row.get("status") != "removed" for row in files if isinstance(row, dict)):
              raise SystemExit("tag_dispatch_requires_deletions_only")

          payload = json.dumps(
              {
                  "ref": "main",
                  "inputs": {
                      "request_id": "issue-42-pr49-cut-0.1.1",
                      "cleanup_pr": pr_number,
                      "cleanup_head_sha": pr_head_sha,
                  },
              },
              separators=(",", ":"),
          ).encode("utf-8")
          request = urllib.request.Request(
              f"{api}/actions/workflows/cut-release-0.1.1-tag.yml/dispatches",
              data=payload,
              headers={**headers, "Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 204:
                      raise SystemExit("tag_dispatch_not_created")
          except urllib.error.HTTPError as error:
              raise SystemExit(f"tag_dispatch_github_http_{error.code}") from None
          except OSError:
              raise SystemExit("tag_dispatch_github_request_failed") from None

          print(
              json.dumps(
                  {
                      "cleanup_head_sha": pr_head_sha,
                      "cleanup_pr": pr_number,
                      "dispatch": "created",
                      "request_id": "issue-42-pr49-cut-0.1.1",
                  },
                  separators=(",", ":"),
                  sort_keys=True,
              )
          )
          PY
