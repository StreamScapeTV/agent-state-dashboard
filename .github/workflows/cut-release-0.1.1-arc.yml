name: Cut immutable dashboard 0.1.1 tag on ARC

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: agent-state-dashboard-cut-release-0.1.1-arc
  cancel-in-progress: false

jobs:
  admit_cleanup:
    name: Admit exact cleanup PR on protected source
    if: >-
      github.repository == 'StreamScapeTV/agent-state-dashboard' &&
      github.event_name == 'pull_request_target' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.number == 49 &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == 'StreamScapeTV/agent-state-dashboard' &&
      github.event.pull_request.head.ref == 'orchestrator/issue-42-remove-tag-helper' &&
      github.event.pull_request.user.login == 'mimranfaruqi' &&
      github.event.pull_request.title == '[#42] Remove temporary 0.1.1 tag helper' &&
      github.event.pull_request.draft == false
    runs-on: [linux, amd64, general, tiny]
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.admit.outputs.base_sha }}
      cleanup_head_sha: ${{ steps.admit.outputs.cleanup_head_sha }}
      pr_number: ${{ steps.admit.outputs.pr_number }}
    env:
      ADMISSION_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - id: admit
        name: Verify current main and exact two-file cleanup diff
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import urllib.error
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          pr_base_sha = os.environ["PR_BASE_SHA"]
          pr_head_sha = os.environ["PR_HEAD_SHA"]
          token = os.environ["ADMISSION_TOKEN"]

          if os.environ["GITHUB_EVENT_NAME"] != "pull_request_target":
              raise SystemExit("arc_admission_event_mismatch")
          if repository != "StreamScapeTV/agent-state-dashboard" or pr_number != "49":
              raise SystemExit("arc_admission_identity_mismatch")
          for name, value in (("base", pr_base_sha), ("head", pr_head_sha)):
              if re.fullmatch(r"[0-9a-f]{40}", value) is None:
                  raise SystemExit(f"arc_admission_{name}_sha_invalid")
          if not token:
              raise SystemExit("arc_admission_token_required")

          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "StreamScapeTV-agent-state-dashboard-release-admission",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(path: str):
              request = urllib.request.Request(f"{api}{path}", headers=headers, method="GET")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read(1_000_001)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"arc_admission_github_http_{error.code}") from None
              except OSError:
                  raise SystemExit("arc_admission_github_request_failed") from None
              if len(raw) > 1_000_000:
                  raise SystemExit("arc_admission_response_too_large")
              try:
                  return json.loads(raw.decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError):
                  raise SystemExit("arc_admission_response_invalid") from None

          main_ref = get("/git/ref/heads/main")
          if not isinstance(main_ref, dict) or main_ref.get("object", {}).get("sha") != pr_base_sha:
              raise SystemExit("arc_admission_main_drifted")

          pull = get(f"/pulls/{pr_number}")
          if not isinstance(pull, dict):
              raise SystemExit("arc_admission_pull_invalid")
          if pull.get("base", {}).get("ref") != "main" or pull.get("base", {}).get("sha") != pr_base_sha:
              raise SystemExit("arc_admission_base_identity_mismatch")
          if pull.get("head", {}).get("ref") != "orchestrator/issue-42-remove-tag-helper" or pull.get("head", {}).get("sha") != pr_head_sha:
              raise SystemExit("arc_admission_head_identity_mismatch")
          if pull.get("head", {}).get("repo", {}).get("full_name") != repository:
              raise SystemExit("arc_admission_head_repository_mismatch")
          if pull.get("user", {}).get("login") != "mimranfaruqi":
              raise SystemExit("arc_admission_author_mismatch")
          if pull.get("title") != "[#42] Remove temporary 0.1.1 tag helper" or pull.get("draft") is not False:
              raise SystemExit("arc_admission_metadata_mismatch")

          files = get(f"/pulls/{pr_number}/files?per_page=100")
          if not isinstance(files, list):
              raise SystemExit("arc_admission_files_invalid")
          expected_files = {
              ".github/workflows/cut-release-0.1.1-tag.yml",
              "tests/release-tag-cut.test.mjs",
          }
          filenames = {row.get("filename") for row in files if isinstance(row, dict)}
          if filenames != expected_files or len(files) != 2:
              raise SystemExit("arc_admission_file_set_mismatch")
          if any(row.get("status") != "removed" for row in files if isinstance(row, dict)):
              raise SystemExit("arc_admission_requires_deletions_only")

          print(json.dumps({"base_sha": pr_base_sha, "cleanup_head_sha": pr_head_sha, "pr_number": pr_number}, separators=(",", ":"), sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"base_sha={pr_base_sha}\n")
              output.write(f"cleanup_head_sha={pr_head_sha}\n")
              output.write(f"pr_number={pr_number}\n")
          PY

  cut_tag:
    name: Create and read back exact 0.1.1 tag
    needs: admit_cleanup
    runs-on: [linux, amd64, general, tiny]
    timeout-minutes: 10
    env:
      RELEASE_TAG: 0.1.1
      RELEASE_SOURCE_SHA: c86db7ae3dd9a223e42cd2c4830b75fc175f72a9
      ADMITTED_BASE_SHA: ${{ needs.admit_cleanup.outputs.base_sha }}
      CLEANUP_HEAD_SHA: ${{ needs.admit_cleanup.outputs.cleanup_head_sha }}
      CLEANUP_PR_NUMBER: ${{ needs.admit_cleanup.outputs.pr_number }}
      ORGANIZATION_MAINTENANCE_TOKEN: ${{ secrets.ORGANIZATION_MAINTENANCE_TOKEN }}
    steps:
      - name: Create or verify exact lightweight tag
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          release_tag = os.environ["RELEASE_TAG"]
          release_source_sha = os.environ["RELEASE_SOURCE_SHA"]
          admitted_base_sha = os.environ["ADMITTED_BASE_SHA"]
          cleanup_head_sha = os.environ["CLEANUP_HEAD_SHA"]
          cleanup_pr_number = os.environ["CLEANUP_PR_NUMBER"]
          token = os.environ["ORGANIZATION_MAINTENANCE_TOKEN"]

          if os.environ["GITHUB_EVENT_NAME"] != "pull_request_target" or repository != "StreamScapeTV/agent-state-dashboard":
              raise SystemExit("release_tag_event_not_trusted")
          if cleanup_pr_number != "49" or release_tag != "0.1.1":
              raise SystemExit("release_tag_identity_invalid")
          for name, value in (("base", admitted_base_sha), ("cleanup", cleanup_head_sha), ("source", release_source_sha)):
              if re.fullmatch(r"[0-9a-f]{40}", value) is None:
                  raise SystemExit(f"release_tag_{name}_sha_invalid")
          if not token or any(character in token for character in "\x00\r\n"):
              raise SystemExit("organization_maintenance_token_required")

          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "StreamScapeTV-agent-state-dashboard-release-tag",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method: str, path: str, payload: dict[str, str] | None = None, *, missing_ok: bool = False):
              body = None
              request_headers = dict(headers)
              if payload is not None:
                  body = json.dumps(payload, separators=(",", ":")).encode("utf-8")
                  request_headers["Content-Type"] = "application/json"
              req = urllib.request.Request(f"{api}{path}", data=body, headers=request_headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read(1_000_001)
              except urllib.error.HTTPError as error:
                  if missing_ok and error.code == 404:
                      return None
                  raise SystemExit(f"github_http_{error.code}") from None
              except OSError:
                  raise SystemExit("github_request_failed") from None
              if len(raw) > 1_000_000:
                  raise SystemExit("github_response_too_large")
              try:
                  value = json.loads(raw.decode("utf-8")) if raw else {}
              except (UnicodeDecodeError, json.JSONDecodeError):
                  raise SystemExit("github_response_invalid") from None
              if not isinstance(value, dict):
                  raise SystemExit("github_response_invalid")
              return value

          main_ref = request("GET", "/git/ref/heads/main")
          if main_ref.get("object", {}).get("type") != "commit" or main_ref.get("object", {}).get("sha") != admitted_base_sha:
              raise SystemExit("release_tag_main_drifted")

          source = request("GET", f"/git/commits/{release_source_sha}")
          if source.get("sha") != release_source_sha:
              raise SystemExit("release_source_commit_mismatch")
          comparison = request("GET", f"/compare/{release_source_sha}...{admitted_base_sha}")
          if comparison.get("status") not in {"ahead", "identical"} or comparison.get("merge_base_commit", {}).get("sha") != release_source_sha:
              raise SystemExit("release_source_not_ancestor")

          encoded_tag = urllib.parse.quote(release_tag, safe="")
          tag_path = f"/git/ref/tags/{encoded_tag}"
          existing = request("GET", tag_path, missing_ok=True)
          action = "verified-existing"
          if existing is None:
              request("POST", "/git/refs", {"ref": f"refs/tags/{release_tag}", "sha": release_source_sha})
              action = "created"

          readback = request("GET", tag_path)
          ref_object = readback.get("object", {})
          if ref_object.get("type") != "commit" or ref_object.get("sha") != release_source_sha:
              raise SystemExit("release_tag_target_mismatch")

          print(json.dumps({"action": action, "cleanup_head_sha": cleanup_head_sha, "ref": f"refs/tags/{release_tag}", "source_sha": release_source_sha}, separators=(",", ":"), sort_keys=True))
          PY

  report:
    name: Report ARC tag-gate result
    needs: [admit_cleanup, cut_tag]
    if: always() && github.repository == 'StreamScapeTV/agent-state-dashboard'
    runs-on: [linux, amd64, general, tiny]
    timeout-minutes: 5
    env:
      ISSUE_COMMENT_TOKEN: ${{ github.token }}
      ADMISSION_RESULT: ${{ needs.admit_cleanup.result }}
      TAG_RESULT: ${{ needs.cut_tag.result }}
      CLEANUP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Post bounded ARC gate evidence to issue 42
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["ISSUE_COMMENT_TOKEN"]
          if not token:
              raise SystemExit("arc_report_token_required")
          marker = "<!-- agent-state-dashboard-arc-tag-gate-0.1.1 -->"
          message = (
              f"{marker}\nARC tag-gate run `{os.environ['GITHUB_RUN_ID']}` for cleanup head "
              f"`{os.environ['CLEANUP_HEAD_SHA']}` on base `{os.environ['BASE_SHA']}`: "
              f"admission=`{os.environ['ADMISSION_RESULT']}`, tag=`{os.environ['TAG_RESULT']}`."
          )
          body = json.dumps({"body": message}, separators=(",", ":")).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/issues/42/comments",
              data=body,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "StreamScapeTV-agent-state-dashboard-arc-report",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 201:
                  raise SystemExit("arc_report_comment_not_created")
          PY
