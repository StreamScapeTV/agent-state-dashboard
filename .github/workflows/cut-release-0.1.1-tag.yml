name: Cut immutable dashboard 0.1.1 tag

on:
  pull_request_target:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: agent-state-dashboard-cut-release-0.1.1
  cancel-in-progress: false

jobs:
  admit_cleanup:
    name: Admit exact temporary-helper cleanup PR
    if: >-
      github.repository == 'StreamScapeTV/agent-state-dashboard' &&
      github.event_name == 'pull_request_target' &&
      github.event.action == 'opened' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == 'StreamScapeTV/agent-state-dashboard' &&
      github.event.pull_request.head.ref == 'orchestrator/issue-42-remove-tag-helper' &&
      github.event.pull_request.user.login == 'mimranfaruqi' &&
      github.event.pull_request.title == '[#42] Remove temporary 0.1.1 tag helper' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.admit.outputs.base_sha }}
      cleanup_head_sha: ${{ steps.admit.outputs.cleanup_head_sha }}
      pr_number: ${{ steps.admit.outputs.pr_number }}
    env:
      ADMISSION_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - id: admit
        name: Verify exact cleanup-only diff and current main base
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import urllib.error
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          event_name = os.environ["GITHUB_EVENT_NAME"]
          github_sha = os.environ["GITHUB_SHA"]
          pr_number = os.environ["PR_NUMBER"]
          pr_base_sha = os.environ["PR_BASE_SHA"]
          pr_head_sha = os.environ["PR_HEAD_SHA"]
          token = os.environ["ADMISSION_TOKEN"]

          if event_name != "pull_request_target":
              raise SystemExit("cleanup_admission_event_mismatch")
          if repository != "StreamScapeTV/agent-state-dashboard":
              raise SystemExit("cleanup_admission_repository_mismatch")
          if re.fullmatch(r"[1-9][0-9]*", pr_number) is None:
              raise SystemExit("cleanup_admission_pr_number_invalid")
          for name, value in (("base", pr_base_sha), ("head", pr_head_sha), ("github", github_sha)):
              if re.fullmatch(r"[0-9a-f]{40}", value) is None:
                  raise SystemExit(f"cleanup_admission_{name}_sha_invalid")
          if pr_base_sha != github_sha:
              raise SystemExit("cleanup_admission_base_sha_mismatch")
          if not token:
              raise SystemExit("cleanup_admission_token_required")

          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "StreamScapeTV-agent-state-dashboard-cleanup-admission",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(path: str):
              request = urllib.request.Request(f"{api}{path}", headers=headers, method="GET")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read(1_000_001)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"cleanup_admission_github_http_{error.code}") from None
              except OSError:
                  raise SystemExit("cleanup_admission_github_request_failed") from None
              if len(raw) > 1_000_000:
                  raise SystemExit("cleanup_admission_response_too_large")
              try:
                  return json.loads(raw.decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError):
                  raise SystemExit("cleanup_admission_response_invalid") from None

          main_ref = get("/git/ref/heads/main")
          if not isinstance(main_ref, dict) or main_ref.get("object", {}).get("sha") != pr_base_sha:
              raise SystemExit("cleanup_admission_main_drifted")

          pull = get(f"/pulls/{pr_number}")
          if not isinstance(pull, dict):
              raise SystemExit("cleanup_admission_pull_invalid")
          expected = {
              "base": ("main", pr_base_sha),
              "head": ("orchestrator/issue-42-remove-tag-helper", pr_head_sha),
          }
          for side, (expected_ref, expected_sha) in expected.items():
              row = pull.get(side, {})
              if row.get("ref") != expected_ref or row.get("sha") != expected_sha:
                  raise SystemExit(f"cleanup_admission_{side}_identity_mismatch")
          if pull.get("head", {}).get("repo", {}).get("full_name") != repository:
              raise SystemExit("cleanup_admission_head_repository_mismatch")
          if pull.get("user", {}).get("login") != "mimranfaruqi":
              raise SystemExit("cleanup_admission_author_mismatch")
          if pull.get("title") != "[#42] Remove temporary 0.1.1 tag helper" or pull.get("draft") is not False:
              raise SystemExit("cleanup_admission_metadata_mismatch")

          files = get(f"/pulls/{pr_number}/files?per_page=100")
          if not isinstance(files, list):
              raise SystemExit("cleanup_admission_files_invalid")
          expected_files = {
              ".github/workflows/cut-release-0.1.1-tag.yml",
              "tests/release-tag-cut.test.mjs",
          }
          filenames = {row.get("filename") for row in files if isinstance(row, dict)}
          if filenames != expected_files or len(files) != 2:
              raise SystemExit("cleanup_admission_file_set_mismatch")
          if any(row.get("status") != "removed" for row in files if isinstance(row, dict)):
              raise SystemExit("cleanup_admission_requires_deletions_only")

          evidence = {
              "base_sha": pr_base_sha,
              "cleanup_head_sha": pr_head_sha,
              "pr_number": pr_number,
              "removed_files": sorted(expected_files),
          }
          print(json.dumps(evidence, separators=(",", ":"), sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"base_sha={pr_base_sha}\n")
              output.write(f"cleanup_head_sha={pr_head_sha}\n")
              output.write(f"pr_number={pr_number}\n")
          PY

  cut_tag:
    name: Cut exact 0.1.1 release tag
    needs: admit_cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: 0.1.1
      RELEASE_SOURCE_SHA: c86db7ae3dd9a223e42cd2c4830b75fc175f72a9
      ADMITTED_BASE_SHA: ${{ needs.admit_cleanup.outputs.base_sha }}
      CLEANUP_HEAD_SHA: ${{ needs.admit_cleanup.outputs.cleanup_head_sha }}
      CLEANUP_PR_NUMBER: ${{ needs.admit_cleanup.outputs.pr_number }}
      ORGANIZATION_MAINTENANCE_TOKEN: ${{ secrets.ORGANIZATION_MAINTENANCE_TOKEN }}
    steps:
      - id: tag
        name: Create and read back exact lightweight release tag
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          event_name = os.environ["GITHUB_EVENT_NAME"]
          caller_sha = os.environ["GITHUB_SHA"]
          admitted_base_sha = os.environ["ADMITTED_BASE_SHA"]
          cleanup_head_sha = os.environ["CLEANUP_HEAD_SHA"]
          cleanup_pr_number = os.environ["CLEANUP_PR_NUMBER"]
          release_tag = os.environ["RELEASE_TAG"]
          release_source_sha = os.environ["RELEASE_SOURCE_SHA"]
          token = os.environ["ORGANIZATION_MAINTENANCE_TOKEN"]

          if event_name != "pull_request_target" or repository != "StreamScapeTV/agent-state-dashboard":
              raise SystemExit("release_tag_event_not_trusted")
          for name, value in (
              ("caller", caller_sha),
              ("base", admitted_base_sha),
              ("cleanup", cleanup_head_sha),
              ("source", release_source_sha),
          ):
              if re.fullmatch(r"[0-9a-f]{40}", value) is None:
                  raise SystemExit(f"release_tag_{name}_sha_invalid")
          if caller_sha != admitted_base_sha:
              raise SystemExit("release_tag_base_drifted")
          if re.fullmatch(r"[1-9][0-9]*", cleanup_pr_number) is None:
              raise SystemExit("release_tag_cleanup_pr_invalid")
          if release_tag != "0.1.1":
              raise SystemExit("release_tag_identity_invalid")
          if not token or any(character in token for character in "\x00\r\n"):
              raise SystemExit("organization_maintenance_token_required")

          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "StreamScapeTV-agent-state-dashboard-release-tag",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method: str, path: str, payload: dict[str, str] | None = None, *, missing_ok: bool = False):
              body = None
              request_headers = dict(headers)
              if payload is not None:
                  body = json.dumps(payload, separators=(",", ":")).encode("utf-8")
                  request_headers["Content-Type"] = "application/json"
              req = urllib.request.Request(f"{api}{path}", data=body, headers=request_headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read(1_000_001)
                      if len(raw) > 1_000_000:
                          raise SystemExit("github_response_too_large")
                      value = json.loads(raw.decode("utf-8")) if raw else {}
                      if not isinstance(value, dict):
                          raise SystemExit("github_response_invalid")
                      return value
              except urllib.error.HTTPError as error:
                  if missing_ok and error.code == 404:
                      return None
                  raise SystemExit(f"github_http_{error.code}") from None
              except (OSError, UnicodeDecodeError, json.JSONDecodeError, ValueError):
                  raise SystemExit("github_request_failed") from None

          main_ref = request("GET", "/git/ref/heads/main")
          if main_ref.get("object", {}).get("type") != "commit" or main_ref.get("object", {}).get("sha") != admitted_base_sha:
              raise SystemExit("release_tag_main_drifted")

          target_commit = request("GET", f"/git/commits/{release_source_sha}")
          if target_commit.get("sha") != release_source_sha:
              raise SystemExit("release_source_commit_mismatch")

          comparison = request("GET", f"/compare/{release_source_sha}...{admitted_base_sha}")
          if comparison.get("status") not in {"ahead", "identical"}:
              raise SystemExit("release_source_not_ancestor")
          if comparison.get("merge_base_commit", {}).get("sha") != release_source_sha:
              raise SystemExit("release_source_merge_base_mismatch")

          encoded_tag = urllib.parse.quote(release_tag, safe="")
          tag_path = f"/git/ref/tags/{encoded_tag}"
          existing = request("GET", tag_path, missing_ok=True)
          action = "verified-existing"
          if existing is None:
              try:
                  request("POST", "/git/refs", {"ref": f"refs/tags/{release_tag}", "sha": release_source_sha})
                  action = "created"
              except SystemExit as error:
                  if str(error) != "github_http_422":
                      raise
                  action = "verified-raced"

          readback = request("GET", tag_path)
          ref_object = readback.get("object", {})
          if ref_object.get("type") != "commit":
              raise SystemExit("release_tag_not_lightweight_commit")
          if ref_object.get("sha") != release_source_sha:
              raise SystemExit("release_tag_target_mismatch")

          evidence = {
              "action": action,
              "cleanup_head_sha": cleanup_head_sha,
              "cleanup_pr_number": cleanup_pr_number,
              "ref": f"refs/tags/{release_tag}",
              "repository": repository,
              "source_sha": release_source_sha,
              "tag": release_tag,
          }
          print(json.dumps(evidence, separators=(",", ":"), sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"action={action}\n")
              output.write(f"tag={release_tag}\n")
              output.write(f"source_sha={release_source_sha}\n")
          PY

      - id: release
        name: Locate tag-triggered publication run
        shell: bash
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          release_source_sha = os.environ["RELEASE_SOURCE_SHA"]
          token = os.environ["ACTIONS_READ_TOKEN"]
          query = urllib.parse.urlencode({"event": "push", "per_page": "20"})
          url = f"https://api.github.com/repos/{repository}/actions/workflows/release.yml/runs?{query}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "StreamScapeTV-agent-state-dashboard-release-observer",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          observed = None
          for attempt in range(45):
              request = urllib.request.Request(url, headers=headers, method="GET")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
              except (urllib.error.URLError, OSError, json.JSONDecodeError, ValueError):
                  payload = {}
              runs = payload.get("workflow_runs", []) if isinstance(payload, dict) else []
              observed = next(
                  (
                      run for run in runs
                      if isinstance(run, dict)
                      and run.get("event") == "push"
                      and run.get("head_sha") == release_source_sha
                      and run.get("name") == "Publish tagged dashboard image and chart"
                  ),
                  None,
              )
              if observed is not None:
                  break
              if attempt < 44:
                  time.sleep(2)
          if observed is None:
              raise SystemExit("release_run_not_observed")
          run_id = observed.get("id")
          if not isinstance(run_id, int) or run_id <= 0:
              raise SystemExit("release_run_id_invalid")
          print(json.dumps({"release_run_id": run_id, "status": observed.get("status"), "conclusion": observed.get("conclusion")}, separators=(",", ":"), sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_id={run_id}\n")
          PY

      - name: Report bounded tag-cut evidence to issue 42
        if: always()
        continue-on-error: true
        shell: bash
        env:
          ISSUE_COMMENT_TOKEN: ${{ github.token }}
          TAG_OUTCOME: ${{ steps.tag.outcome }}
          TAG_ACTION: ${{ steps.tag.outputs.action }}
          RELEASE_LOOKUP_OUTCOME: ${{ steps.release.outcome }}
          RELEASE_RUN_ID: ${{ steps.release.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          helper_run_id = os.environ["GITHUB_RUN_ID"]
          release_tag = os.environ["RELEASE_TAG"]
          release_source_sha = os.environ["RELEASE_SOURCE_SHA"]
          cleanup_pr = os.environ["CLEANUP_PR_NUMBER"]
          tag_outcome = os.environ.get("TAG_OUTCOME", "")
          tag_action = os.environ.get("TAG_ACTION", "")
          release_lookup_outcome = os.environ.get("RELEASE_LOOKUP_OUTCOME", "")
          release_run_id = os.environ.get("RELEASE_RUN_ID", "")
          token = os.environ["ISSUE_COMMENT_TOKEN"]
          marker = "<!-- agent-state-dashboard-release-tag-cut-0.1.1 -->"
          if tag_outcome == "success" and release_lookup_outcome == "success" and release_run_id:
              message = (
                  f"{marker}\nRelease tag-cut helper run `{helper_run_id}` admitted cleanup PR `#{cleanup_pr}`, "
                  f"verified lightweight tag `{release_tag}` -> `{release_source_sha}` (`{tag_action}`), and observed "
                  f"tag-triggered publication run `{release_run_id}`."
              )
          elif tag_outcome == "success":
              message = (
                  f"{marker}\nRelease tag-cut helper run `{helper_run_id}` admitted cleanup PR `#{cleanup_pr}` and "
                  f"verified lightweight tag `{release_tag}` -> `{release_source_sha}` (`{tag_action}`), but the "
                  "downstream publication run was not observed within the bounded lookup window."
              )
          else:
              message = (
                  f"{marker}\nRelease tag-cut helper run `{helper_run_id}` did not verify tag `{release_tag}` at "
                  f"`{release_source_sha}` after cleanup PR `#{cleanup_pr}` admission; no producer completion is claimed."
              )
          body = json.dumps({"body": message}, separators=(",", ":")).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/issues/42/comments",
              data=body,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "StreamScapeTV-agent-state-dashboard-release-reporter",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 201:
                  raise SystemExit("issue_comment_not_created")
          PY
