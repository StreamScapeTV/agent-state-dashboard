name: Cut immutable dashboard 0.1.1 tag

on:
  workflow_run:
    workflows: ["Node validation"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: agent-state-dashboard-cut-release-0.1.1
  cancel-in-progress: false

jobs:
  cut_tag:
    name: Cut exact 0.1.1 release tag
    if: >-
      github.repository == 'StreamScapeTV/agent-state-dashboard' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.id == 32136685577 &&
      github.event.workflow_run.name == 'Node validation' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == 'StreamScapeTV/agent-state-dashboard' &&
      github.event.workflow_run.head_sha == '69bb56cd0083b668a76d20ee32d247700923b41b'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: 0.1.1
      RELEASE_SOURCE_SHA: c86db7ae3dd9a223e42cd2c4830b75fc175f72a9
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
      TRIGGER_RUN_NAME: ${{ github.event.workflow_run.name }}
      TRIGGER_RUN_EVENT: ${{ github.event.workflow_run.event }}
      TRIGGER_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      TRIGGER_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
      TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      ORGANIZATION_MAINTENANCE_TOKEN: ${{ secrets.ORGANIZATION_MAINTENANCE_TOKEN }}
    steps:
      - name: Require exact successful validated run and non-recursive tag authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_EVENT_NAME}" = workflow_run
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_REPOSITORY}" = StreamScapeTV/agent-state-dashboard
          test "${TRIGGER_RUN_ID}" = 32136685577
          test "${TRIGGER_RUN_NAME}" = "Node validation"
          test "${TRIGGER_RUN_EVENT}" = pull_request
          test "${TRIGGER_RUN_CONCLUSION}" = success
          test "${TRIGGER_HEAD_REPOSITORY}" = StreamScapeTV/agent-state-dashboard
          test "${TRIGGER_HEAD_SHA}" = 69bb56cd0083b668a76d20ee32d247700923b41b
          test -n "${ORGANIZATION_MAINTENANCE_TOKEN}"

      - id: tag
        name: Create and read back exact lightweight release tag
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          event_name = os.environ["GITHUB_EVENT_NAME"]
          branch_ref = os.environ["GITHUB_REF"]
          caller_sha = os.environ["GITHUB_SHA"]
          trigger_run_id = os.environ["TRIGGER_RUN_ID"]
          trigger_run_name = os.environ["TRIGGER_RUN_NAME"]
          trigger_run_event = os.environ["TRIGGER_RUN_EVENT"]
          trigger_run_conclusion = os.environ["TRIGGER_RUN_CONCLUSION"]
          trigger_head_repository = os.environ["TRIGGER_HEAD_REPOSITORY"]
          trigger_head_sha = os.environ["TRIGGER_HEAD_SHA"]
          release_tag = os.environ["RELEASE_TAG"]
          release_source_sha = os.environ["RELEASE_SOURCE_SHA"]
          token = os.environ["ORGANIZATION_MAINTENANCE_TOKEN"]

          if event_name != "workflow_run" or branch_ref != "refs/heads/main":
              raise SystemExit("release_tag_event_not_trusted")
          if repository != "StreamScapeTV/agent-state-dashboard":
              raise SystemExit("release_tag_repository_mismatch")
          if (
              trigger_run_id != "32136685577"
              or trigger_run_name != "Node validation"
              or trigger_run_event != "pull_request"
              or trigger_run_conclusion != "success"
              or trigger_head_repository != "StreamScapeTV/agent-state-dashboard"
              or trigger_head_sha != "69bb56cd0083b668a76d20ee32d247700923b41b"
          ):
              raise SystemExit("release_tag_workflow_run_not_trusted")
          if re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", release_tag) is None:
              raise SystemExit("release_tag_invalid")
          if re.fullmatch(r"[0-9a-f]{40}", release_source_sha) is None:
              raise SystemExit("release_source_sha_invalid")
          if re.fullmatch(r"[0-9a-f]{40}", caller_sha) is None:
              raise SystemExit("caller_sha_invalid")
          if not token or any(character in token for character in "\x00\r\n"):
              raise SystemExit("organization_maintenance_token_required")

          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "StreamScapeTV-agent-state-dashboard-release-tag",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method: str, path: str, payload: dict[str, str] | None = None, *, missing_ok: bool = False):
              body = None
              request_headers = dict(headers)
              if payload is not None:
                  body = json.dumps(payload, separators=(",", ":")).encode("utf-8")
                  request_headers["Content-Type"] = "application/json"
              req = urllib.request.Request(f"{api}{path}", data=body, headers=request_headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read(1_000_001)
                      if len(raw) > 1_000_000:
                          raise SystemExit("github_response_too_large")
                      value = json.loads(raw.decode("utf-8")) if raw else {}
                      if not isinstance(value, dict):
                          raise SystemExit("github_response_invalid")
                      return value
              except urllib.error.HTTPError as error:
                  if missing_ok and error.code == 404:
                      return None
                  raise SystemExit(f"github_http_{error.code}") from None
              except (OSError, UnicodeDecodeError, json.JSONDecodeError, ValueError):
                  raise SystemExit("github_request_failed") from None

          main_ref = request("GET", "/git/ref/heads/main")
          if main_ref.get("object", {}).get("type") != "commit" or main_ref.get("object", {}).get("sha") != caller_sha:
              raise SystemExit("main_head_drifted")

          target_commit = request("GET", f"/git/commits/{release_source_sha}")
          if target_commit.get("sha") != release_source_sha:
              raise SystemExit("release_source_commit_mismatch")

          comparison = request("GET", f"/compare/{release_source_sha}...{caller_sha}")
          if comparison.get("status") not in {"ahead", "identical"}:
              raise SystemExit("release_source_not_ancestor")
          if comparison.get("merge_base_commit", {}).get("sha") != release_source_sha:
              raise SystemExit("release_source_merge_base_mismatch")

          encoded_tag = urllib.parse.quote(release_tag, safe="")
          tag_path = f"/git/ref/tags/{encoded_tag}"
          existing = request("GET", tag_path, missing_ok=True)
          action = "verified-existing"

          if existing is None:
              try:
                  request(
                      "POST",
                      "/git/refs",
                      {"ref": f"refs/tags/{release_tag}", "sha": release_source_sha},
                  )
                  action = "created"
              except SystemExit as error:
                  if str(error) != "github_http_422":
                      raise
                  action = "verified-raced"

          readback = request("GET", tag_path)
          ref_object = readback.get("object", {})
          if ref_object.get("type") != "commit":
              raise SystemExit("release_tag_not_lightweight_commit")
          if ref_object.get("sha") != release_source_sha:
              raise SystemExit("release_tag_target_mismatch")

          evidence = {
              "action": action,
              "repository": repository,
              "tag": release_tag,
              "ref": f"refs/tags/{release_tag}",
              "source_sha": release_source_sha,
              "trigger_sha": caller_sha,
              "validated_run_id": trigger_run_id,
              "validated_head_sha": trigger_head_sha,
          }
          print(json.dumps(evidence, separators=(",", ":"), sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"action={action}\n")
              output.write(f"tag={release_tag}\n")
              output.write(f"source_sha={release_source_sha}\n")
          PY

      - id: release
        name: Locate tag-triggered publication run
        shell: bash
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          release_source_sha = os.environ["RELEASE_SOURCE_SHA"]
          release_tag = os.environ["RELEASE_TAG"]
          token = os.environ["ACTIONS_READ_TOKEN"]
          if not token:
              raise SystemExit("actions_read_token_required")

          query = urllib.parse.urlencode({"event": "push", "per_page": "20"})
          url = f"https://api.github.com/repos/{repository}/actions/workflows/release.yml/runs?{query}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "StreamScapeTV-agent-state-dashboard-release-observer",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          observed = None
          for attempt in range(30):
              req = urllib.request.Request(url, headers=headers, method="GET")
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = json.load(response)
              except (urllib.error.URLError, OSError, json.JSONDecodeError, ValueError):
                  payload = {}
              runs = payload.get("workflow_runs", []) if isinstance(payload, dict) else []
              observed = next(
                  (
                      run
                      for run in runs
                      if isinstance(run, dict)
                      and run.get("event") == "push"
                      and run.get("head_sha") == release_source_sha
                      and run.get("name") == "Publish tagged dashboard image and chart"
                  ),
                  None,
              )
              if observed is not None:
                  break
              if attempt < 29:
                  time.sleep(2)

          if observed is None:
              raise SystemExit("release_run_not_observed")

          run_id = observed.get("id")
          if not isinstance(run_id, int) or run_id <= 0:
              raise SystemExit("release_run_id_invalid")
          run_url = observed.get("html_url")
          if not isinstance(run_url, str) or not run_url.startswith(f"https://github.com/{repository}/actions/runs/"):
              raise SystemExit("release_run_url_invalid")

          evidence = {
              "release_run_id": run_id,
              "release_run_status": observed.get("status"),
              "release_run_conclusion": observed.get("conclusion"),
              "release_source_sha": release_source_sha,
              "release_tag": release_tag,
          }
          print(json.dumps(evidence, separators=(",", ":"), sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_id={run_id}\n")
              output.write(f"run_url={run_url}\n")
          PY

      - name: Report bounded tag-cut evidence to issue 42
        if: always()
        continue-on-error: true
        shell: bash
        env:
          ISSUE_COMMENT_TOKEN: ${{ github.token }}
          TAG_OUTCOME: ${{ steps.tag.outcome }}
          TAG_ACTION: ${{ steps.tag.outputs.action }}
          RELEASE_LOOKUP_OUTCOME: ${{ steps.release.outcome }}
          RELEASE_RUN_ID: ${{ steps.release.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          helper_run_id = os.environ["GITHUB_RUN_ID"]
          release_tag = os.environ["RELEASE_TAG"]
          release_source_sha = os.environ["RELEASE_SOURCE_SHA"]
          tag_outcome = os.environ.get("TAG_OUTCOME", "")
          tag_action = os.environ.get("TAG_ACTION", "")
          release_lookup_outcome = os.environ.get("RELEASE_LOOKUP_OUTCOME", "")
          release_run_id = os.environ.get("RELEASE_RUN_ID", "")
          token = os.environ["ISSUE_COMMENT_TOKEN"]

          marker = "<!-- agent-state-dashboard-release-tag-cut-0.1.1 -->"
          if tag_outcome == "success" and release_lookup_outcome == "success" and release_run_id:
              message = (
                  f"{marker}\nRelease tag-cut helper run `{helper_run_id}` verified lightweight tag "
                  f"`{release_tag}` -> `{release_source_sha}` (`{tag_action}`) from validated Node run "
                  f"`{os.environ['TRIGGER_RUN_ID']}` and observed tag-triggered publication run `{release_run_id}`."
              )
          elif tag_outcome == "success":
              message = (
                  f"{marker}\nRelease tag-cut helper run `{helper_run_id}` verified lightweight tag "
                  f"`{release_tag}` -> `{release_source_sha}` (`{tag_action}`) from validated Node run "
                  f"`{os.environ['TRIGGER_RUN_ID']}`, but the downstream tag-triggered publication run was not "
                  "observed within the bounded lookup window."
              )
          else:
              message = (
                  f"{marker}\nRelease tag-cut helper run `{helper_run_id}` did not verify tag "
                  f"`{release_tag}` at `{release_source_sha}` from validated Node run "
                  f"`{os.environ['TRIGGER_RUN_ID']}`; no producer completion is claimed."
              )

          body = json.dumps({"body": message}, separators=(",", ":")).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/issues/42/comments",
              data=body,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "StreamScapeTV-agent-state-dashboard-release-reporter",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 201:
                  raise SystemExit("issue_comment_not_created")
          PY
